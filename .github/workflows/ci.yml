# Runs every test on each pull request and on each push to main, so a change
# that breaks a calculation, an ownership check or the build shows up on the
# PR before it is merged (and deployed by Vercel / Railway).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (build, unit, API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # Throwaway database for the API tests (the suite truncates every table).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Migrate the test database
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - name: API tests
        run: npm run test:e2e

  client:
    name: Client (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Type check and build
        run: npm run build
