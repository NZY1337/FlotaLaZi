<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- In the HTML itself, so search engines and link previews (Facebook,
         WhatsApp) see them without running JavaScript. data-rh on the title
         lets react-helmet-async replace it on other pages (PageMeta). The
         description stays: PageMeta's own description never reaches the
         page with React 19, so this one is the site's description. -->
    <title data-rh="true">FlotaLaZi — acte, revizii și profit pentru flota ta</title>
    <meta name="description" content="Alerte pentru ITP, RCA, rovinietă, tahograf și actele șoferilor. Pentru firme de transport din România." />
    <link rel="canonical" href="https://www.flotalazi.ro/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlotaLaZi" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:url" content="https://www.flotalazi.ro/" />
    <meta property="og:title" content="FlotaLaZi — Niciun act expirat. Nicio amendă." />
    <meta property="og:description" content="Alerte pentru ITP, RCA, rovinietă, tahograf și actele șoferilor. Pentru firme de transport din România." />
    <meta property="og:image" content="https://www.flotalazi.ro/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlotaLaZi: Niciun act expirat. Nicio amendă." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
